name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, analyze and test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project signs with the developer's team, whose certificates are not on the runner.
      - name: Build and analyze
        run: |
          xcodebuild clean build analyze \
            -project GridGuide.xcodeproj \
            -scheme GridGuide \
            -destination platform=macOS \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test \
            -project GridGuide.xcodeproj \
            -scheme GridGuide \
            -destination platform=macOS \
            -only-testing:GridGuideTests \
            CODE_SIGNING_ALLOWED=NO
